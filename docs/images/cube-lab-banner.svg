<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc"><title id="title">轻拧 · CUBEFLOW</title><desc id="desc">四段循环箭头代表 CFOP 四个阶段，中心方点代表专注与复原。</desc><rect width="960" height="280" rx="24" fill="#f2f7f3"/><g transform="translate(60 60)"><g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="10"><path d="M36 66V36h62l-12-12m12 12L86 48" stroke="#24785e"/><path d="M94 36h30v62l12-12m-12 12-12-12" stroke="#568bce"/><path d="M124 94v30H62l12 12m-12-12 12-12" stroke="#d7a343"/><path d="M66 124H36V62L24 74m12-12 12 12" stroke="#53ae94"/></g><rect x="67" y="67" width="26" height="26" rx="7" fill="#24785e"/></g><g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif"><text x="270" y="112" font-size="53" font-weight="700" fill="#183c30">轻拧 <tspan dx="12" font-size="33" font-weight="400" letter-spacing="2">CUBEFLOW</tspan></text><text x="273" y="158" font-size="23" fill="#667d70">每一次转动，都更从容。</text><text x="273" y="205" font-size="13" letter-spacing="3" fill="#667d70">CFOP · 119 CASES · LEARN IN MOTION</text></g></svg>